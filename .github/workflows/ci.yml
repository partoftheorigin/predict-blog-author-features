name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: circleci/python:3.6.1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: ./venv
          key: v1-dependencies-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            v1-dependencies-

      - name: install dependencies
        run: |
          python3 -m venv venv
          . venv/bin/activate
          pip3 install -r requirements.txt

      - uses: actions/cache/save@v4
        with:
          path: ./venv
          key: v1-dependencies-${{ hashFiles('requirements.txt') }}

      - name: run tests
        run: |
          . venv/bin/activate
          python3 text_classification.py

      - uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: test-reports